[package]
name = "boat-desktop"
version = "0.1.0"
description = "BoAT Desktop — Boğaziçi University Annotation Tool"
edition = "2021"

[lib]
name = "boat_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
